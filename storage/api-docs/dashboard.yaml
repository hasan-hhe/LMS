      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAuthorRequest'
      responses:
        '201':
          description: Author created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/authors/{author}:
    get:
      tags: [Authors]
      summary: Get an author
