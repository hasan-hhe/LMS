    put:
      tags: [Authors]
      summary: Update an author
      description: Reuses store validation — `firstname`, `lastname`, and `nationality` are required.
      operationId: dashboardAuthorsUpdate
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AuthorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAuthorRequest'
      responses:
        '200':
          description: Author updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Authors]
      summary: Update an author
      operationId: dashboardAuthorsPatch
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AuthorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAuthorRequest'
      responses:
        '200':
          description: Author updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorEnvelope'
    delete:
      tags: [Authors]
      summary: Delete an author
      operationId: dashboardAuthorsDestroy
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AuthorId'
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/categories:
    get:
      tags: [Categories]
      summary: List categories
      operationId: dashboardCategoriesIndex
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Categories retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategories'
    post:
      tags: [Categories]
      summary: Create a category
      operationId: dashboardCategoriesStore
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/categories/{category}:
    get:
      tags: [Categories]
      summary: Get a category
      operationId: dashboardCategoriesShow
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      summary: Update a category
      description: Reuses store validation — `title` and `discription` are required.
      operationId: dashboardCategoriesUpdate
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Categories]
      summary: Update a category
      operationId: dashboardCategoriesPatch
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
    delete:
      tags: [Categories]
      summary: Delete a category
      operationId: dashboardCategoriesDestroy
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/publishers:
    get:
      tags: [Publishers]
      summary: List publishers
      operationId: dashboardPublishersIndex
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Publishers retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublishers'
    post:
      tags: [Publishers]
      summary: Create a publisher
      operationId: dashboardPublishersStore
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePublisherRequest'
      responses:
        '201':
          description: Publisher created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/publishers/{publisher}:
    get:
      tags: [Publishers]
      summary: Get a publisher
      operationId: dashboardPublishersShow
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PublisherId'
      responses:
        '200':
          description: Publisher found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Publishers]
      summary: Update a publisher
      operationId: dashboardPublishersUpdate
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PublisherId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePublisherRequest'
      responses:
        '200':
          description: Publisher updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Publishers]
      summary: Update a publisher
      operationId: dashboardPublishersPatch
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PublisherId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePublisherRequest'
      responses:
        '200':
          description: Publisher updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherEnvelope'
    delete:
      tags: [Publishers]
      summary: Delete a publisher
      operationId: dashboardPublishersDestroy
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PublisherId'
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/books/{isbn}/digital:
    get:
      tags: [Digital Assets]
      summary: Get digital files for a book
      operationId: dashboardDigitalShow
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Isbn'
      responses:
        '200':
          description: Digital asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalAssetEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Digital Assets]
      summary: Upload or replace digital files
      description: Multipart. On first create, at least one of `pdf` or `audio` is required.
      operationId: dashboardDigitalUpsertPost
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Isbn'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpsertDigitalAssetRequest'
      responses:
        '200':
          description: Digital asset saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalAssetEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Digital Assets]
      summary: Upload or replace digital files
      operationId: dashboardDigitalUpsertPut
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Isbn'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpsertDigitalAssetRequest'
      responses:
        '200':
          description: Digital asset saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalAssetEnvelope'
        '422':
