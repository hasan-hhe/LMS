        '200':
          $ref: '#/components/responses/MessageOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/favorites:
    get:
      tags: [Favorites]
      summary: List a member's favorites
      operationId: dashboardFavoritesIndex
      security: [{ bearerAuth: [] }]
      parameters:
        - name: member_id
          in: query
          required: true
          schema: { type: integer }
          description: User ID of a MEMBER
      responses:
        '200':
          description: Favorites retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritesEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/reviews:
    get:
      tags: [Reviews]
      summary: List reviews
      operationId: dashboardReviewsIndex
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: isbn, in: query, schema: { type: string } }
        - { name: member_id, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer, default: 15 } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Reviews retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviews'

  /v1/books/{isbn}/reviews:
    get:
      tags: [Reviews]
      summary: List reviews for a book
      operationId: dashboardReviewsByBook
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Isbn'
      responses:
        '200':
          description: Reviews retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewsEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/reviews/{review}:
    delete:
      tags: [Reviews]
      summary: Delete a review
      operationId: dashboardReviewsDestroy
      security: [{ bearerAuth: [] }]
      parameters:
        - name: review
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/members:
    get:
      tags: [Members]
      summary: List members
      operationId: dashboardMembersIndex
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Members retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
    post:
      tags: [Members]
      summary: Create a member
      operationId: dashboardMembersStore
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreMemberRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/StoreMemberRequest'
      responses:
        '201':
          description: Member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
