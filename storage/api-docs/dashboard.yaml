      responses:
        '200':
          description: Copies retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookInstances'
    post:
      tags: [Book Instances]
      summary: Create a copy
      operationId: dashboardBookInstancesStore
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBookInstanceRequest'
      responses:
        '201':
          description: Copy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookInstanceEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/book-instances/{book_instance}:
    get:
      tags: [Book Instances]
      summary: Get a copy
      operationId: dashboardBookInstancesShow
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookInstanceId'
      responses:
        '200':
          description: Copy found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookInstanceEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Book Instances]
      summary: Update a copy
      operationId: dashboardBookInstancesUpdate
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookInstanceId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookInstanceRequest'
      responses:
        '200':
          description: Copy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookInstanceEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Book Instances]
      summary: Partially update a copy
      operationId: dashboardBookInstancesPatch
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookInstanceId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookInstanceRequest'
      responses:
        '200':
          description: Copy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookInstanceEnvelope'
    delete:
      tags: [Book Instances]
      summary: Delete a copy
      operationId: dashboardBookInstancesDestroy
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BookInstanceId'
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        '404':
          $ref: '#/components/responses/NotFound'

