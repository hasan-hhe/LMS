        auther_id: { type: integer, description: Author ID (authers table) }
        catagory_id: { type: integer, description: Category ID (catagories table) }
        publisher_id: { type: integer }
        title: { type: string, maxLength: 255 }
        discription: { type: string, description: Stored as discription; returned as description }
        price: { type: number, minimum: 0 }
        price_points: { type: integer, minimum: 0, nullable: true }
        amount: { type: integer, minimum: 1 }
        copies_count: { type: integer, minimum: 0, maximum: 500, nullable: true }
