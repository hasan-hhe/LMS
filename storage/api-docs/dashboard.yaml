components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token
      description: Token only — Swagger adds the Bearer prefix

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    Isbn:
      name: isbn
      in: path
      required: true
      schema: { type: string }
      description: Book ISBN (primary key)
    BookInstanceId:
      name: book_instance
      in: path
      required: true
      schema: { type: integer }
    AuthorId:
      name: author
      in: path
      required: true
      schema: { type: integer }
    CategoryId:
      name: category
      in: path
      required: true
      schema: { type: integer }
    PublisherId:
      name: publisher
      in: path
      required: true
      schema: { type: integer }
    MemberId:
      name: member
      in: path
      required: true
      schema: { type: integer }
    LibrarianId:
      name: librarian
      in: path
      required: true
      schema: { type: integer }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    MessageOnly:
      description: Success without a data payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Unauthorized:
      description: Missing or invalid token, or bad credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but wrong role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: error
            body: ليس لديك الصلاحية للوصول لهذا المورد
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    BusinessError:
