openapi: 3.0.3
info:
  title: LMS Dashboard API
  description: |
    Canonical Dashboard API for the Library Management System (admin / librarian).

    **Authentication:** Laravel Sanctum Bearer token.
    Obtain a token via `POST /api/v1/admin/auth/login`.

    **Roles:** `ADMIN` and `LIBRARIAN` on most routes. Librarian CRUD and point settings/adjust require `ADMIN`.

    **Response envelope:** `{ message: success|error, body, data?, errors?, meta? }`.
    `body` messages are in Arabic.
  version: 1.0.0
  contact:
    name: LMS Backend

servers:
  - url: /api
    description: API server

tags:
  - name: Auth
    description: Admin/librarian login, register, logout, and current user
  - name: Books
    description: Book catalog (ADMIN, LIBRARIAN)
  - name: Book Instances
    description: Physical copies (ADMIN, LIBRARIAN)
  - name: Authors
    description: Authors catalog (ADMIN, LIBRARIAN)
  - name: Categories
    description: Categories catalog (ADMIN, LIBRARIAN)
  - name: Publishers
    description: Publishers catalog (ADMIN, LIBRARIAN)
  - name: Digital Assets
    description: PDF / audio files attached to a book
  - name: Favorites
    description: Member favorites (staff lookup)
  - name: Reviews
    description: Book reviews (staff)
  - name: Members
    description: Member accounts (ADMIN, LIBRARIAN)
  - name: Librarians
    description: Librarian accounts (ADMIN only)
  - name: Borrowings
    description: Checkout, return, and extend
  - name: Fines
    description: Late fines
  - name: Reservations
    description: Hold / reserve copies
  - name: Orders
    description: Book purchase orders
  - name: Points
    description: Point balances, history, settings, and adjustments
  - name: Top-Up Codes
    description: Generate and redeem point codes
  - name: Reports
    description: Operational reports and CSV exports

paths:
  /v1/admin/auth/register:
    post:
      tags: [Auth]
      summary: Register a member account
      description: Public. Creates a MEMBER account and returns a Sanctum token.
      operationId: dashboardAuthRegister
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/admin/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Authenticate with email and password. Returns a Sanctum token.
      operationId: dashboardAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
            example:
              email: admin@example.com
              password: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/admin/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Revoke tokens for the authenticated user.
      operationId: dashboardAuthLogout
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/admin/auth/me:
    post:
      tags: [Auth]
      summary: Current user
      operationId: dashboardAuthMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/books:
    get:
      tags: [Books]
      summary: List books
      description: Paginated catalog. **Requires** ADMIN or LIBRARIAN.
      operationId: dashboardBooksIndex
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: author_id, in: query, schema: { type: integer } }
        - { name: year, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Books retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBooks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Books]
      summary: Create a book
      operationId: dashboardBooksStore
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreBookRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBookRequest'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/books/{isbn}:
    get:
      tags: [Books]
      summary: Get a book
      operationId: dashboardBooksShow
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Isbn'
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Books]
      summary: Update a book
      operationId: dashboardBooksUpdate
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Isbn'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Books]
      summary: Partially update a book
      operationId: dashboardBooksPatch
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Isbn'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Books]
      summary: Delete a book
      operationId: dashboardBooksDestroy
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Isbn'
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/book-instances:
    get:
      tags: [Book Instances]
      summary: List book copies
      operationId: dashboardBookInstancesIndex
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: book_isbn, in: query, schema: { type: string } }
        - { name: state_id, in: query, schema: { type: integer } }
